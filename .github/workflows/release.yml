name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: spector-linux-x64
          - os: macos-latest
            artifact: spector-darwin-arm64
          - os: windows-latest
            artifact: spector-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests & typecheck
        run: |
          bun test tests/unit
          bunx --no-install tsc --noEmit

      - name: Compile standalone binary
        run: bun build ./src/index.ts --compile --external "chromium-bidi/*" --outfile release-bin/${{ matrix.artifact }}

      - name: Smoke-check binary
        shell: bash
        run: |
          ./release-bin/${{ matrix.artifact }} --version
          ./release-bin/${{ matrix.artifact }} --help > /dev/null

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-bin/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
